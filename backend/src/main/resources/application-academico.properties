# Perfil exclusivo para las evidencias academicas de la Guia 7 (AA3 en adelante).
# Apunta a la base de datos "zao" (la academica de AA2-EV01), nunca a "zao_db"
# (la base real del proyecto). Reutiliza las mismas variables de entorno que
# ya usa ConexionBD, asi que ninguna contrasena queda escrita en este archivo.

spring.datasource.url=${ZAO_DB_URL}
spring.datasource.username=${ZAO_DB_USER}
spring.datasource.password=${ZAO_DB_PASSWORD}

# validate: Hibernate solo revisa que la entidad coincida con la tabla,
# nunca crea ni modifica nada por su cuenta
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway desactivado en este perfil: zao_db tiene su propio historial de
# migraciones, pero la base academica "zao" no lo necesita ni lo tiene
spring.flyway.enabled=false

# Puerto distinto al 8090 (que usa el perfil "local" del proyecto real),
# para poder tener ambos corriendo sin choque si hiciera falta
server.port=8091

# Parametros adicionales de conexion requeridos por MySQL 8+/9 con el
# plugin de autenticacion caching_sha2_password. Se agregan aqui (no en
# ZAO_DB_URL) para no modificar la variable de entorno que tambien usa
# ConexionBD en el codigo JDBC de AA2.
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.useSSL=false
