# Perfil "servicios" (evidencia AA5-EV03): servicios web del proyecto Zao.
# Usa una base de datos de PRUEBAS llamada zao_pruebas, nunca zao_db (la real).
# El usuario y la contrasena de MySQL se leen de variables de entorno
# (ZAO_DB_USER y ZAO_DB_PASSWORD): ninguna credencial queda escrita aqui.

spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/zao_pruebas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${ZAO_DB_USER}
spring.datasource.password=${ZAO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Siempre "validate": el esquema lo controla Flyway, nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway crea las 10 tablas del proyecto (db/migration) y, solo en este perfil,
# inserta un restaurante de prueba (db/pruebas).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/pruebas

server.port=8090
